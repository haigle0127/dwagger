server:
  port: 8080

spring:
  application:
    name: dwagger-integration-test

# Dwagger 增强配置：dwagger.enable=true 才会启用自动配置（DwaggerAutoConfiguration）
dwagger:
  enable: true
  cors: true
  production: false
  setting:
    language: ZH_CN
    enableSwaggerModels: true
    enableOpenApi: true
    enableFooter: true

# springdoc 基础信息
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  group-configs:
    - group: default
      packages-to-scan: com.example.dwaggerdemo
